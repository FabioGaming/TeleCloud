name: Integrity PR CI

on:
    pull_request:
        branches:
            - "*"

jobs:
    format:
        name: Check Prettier Formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Prettier check
              run: npm run prettier:check

    lint:
        name: Lint
        needs: format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

    test:
        name: Run Tests
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test

    build:
        name: Build Project
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
