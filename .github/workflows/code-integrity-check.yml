name: Integrity PR CI

on:
    pull_request:
        branches:
            - "*"

jobs:
    node_setup:
        name: Setup Node
        runs-on: ubuntu-latest
        outputs:
            node-version: ${{ steps.node-version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - id: node-version
              run: |
                  echo "version=$(node -v)" >> $GITHUB_OUTPUT

    format:
        name: Check Prettier Formatting
        needs: node_setup
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Prettier check
              run: npm run prettier:check

    lint:
        name: Lint
        needs: format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

    test:
        name: Run Tests
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test

    build:
        name: Build Project
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Restore Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
